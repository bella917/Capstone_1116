
<!DOCTYPE html>
<html>

<head>
    <title>TaskSync Login Page</title>

    <style>

        /* Overall Page */
        body {
            background-color: #E9EDF3; /*white color */
            font-family: Arial, sans-serif; /* font */
            text-align: center; /* text automatically aligns to front */
            margin: 0;
        }

        /* White Login Card */
        .login-card {
            background-color: white;
            width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* Headings */
        h1, h4, label {
            color: navy;
        }

        h1 {
            font-size: 42px;
        }

        h4 {
            font-size: 16px;
        }

        /* Logo */
        .logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        /* Textboxes */
        input {
            font-size: 16px;
            padding: 12px;
            width: 85%;
            border: 1px solid #CBD5E1;/* light gray */
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border: 2px solid navy;
        }

        /* Labels */
        label {
            display: block;
            text-align: left;
            margin-left: 7%;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* Buttons */
        button {
            background-color: navy;
            color: white;
            font-size: 18px;
            padding: 12px 25px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin: 8px;
            transition: 0.3s;
        }

        /* Button Hover Effect */
        button:hover {
            background-color: #4169A1; /* blue color */
            transform: scale(1.05);
        }

        /* IT Department Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            color: navy;
            background-color: #E9EDF3; 
            padding: 5px 0;
        }

    </style>

</head>

<body>

    <!-- Login Card -->
    <div class="login-card">

        <h1>TaskSync Login</h1>

        <h4>Please enter your credentials below</h4>

        <!-- Company Logo -->
        <img src="TaskSync Blue Gradient Logo.png" 
             alt="TaskSync Logo"
             class="logo">

        <br><br>

        <!-- Login Form -->
        <form id="loginForm">

            <!-- username textbox -->
            <label for="username">Username:</label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter your username"
                   required>

            <br><br>
            
            <!-- password textbox -->
            <label for="password">Password:</label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <br><br>

            <!-- login button -->
            <button type="submit">
                Login
            </button>

         <!-- submit button -->
            <button type="reset">
                Clear
            </button>

        </form>

    </div>

    <!-- IT Department Contact Information -->
    <h6 class="footer">
        Any problems? Please contact the IT Department:
        555-555-5555
    </h6>


    <!-- Login Navigation -->
    <script>

            // Waits for the user to submit the login form
        document.getElementById("loginForm").addEventListener("submit", function(event) {

       // Prevents the page from refreshing when the form is submitted
            event.preventDefault();

        // Retrieves the username and password entered by the user
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            //test admin login
            if (username === "admin" && password === "admin123") {

                window.location.href = "administrator.html";

            }
            //test manager login
            else if (username === "manager" && password === "manager123") {

                window.location.href = "manager.html";

            }

                // test employee login
            else if (username === "employee" && password === "employee123") {

                window.location.href = "employee.html";

            }

                // error message if invalid login
            else {

                alert("Invalid username or password.");

            }

        });

    </script>

</body>
</html>
