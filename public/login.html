
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSync Login Page</title>

    <style>

        /* Main page formatting */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #E9EDF3;
            font-family: Arial, sans-serif;
            text-align: center;
            color: navy;
        }

        /* Login card */
        .login-card {
            background-color: white;
            width: 450px;
            max-width: 95%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* Main heading */
        h1 {
            font-size: 42px;
            color: navy;
            margin-bottom: 25px;
        }

        /* Subheading */
        h4 {
            font-size: 16px;
            color: navy;
            margin-bottom: 25px;
        }

        /* Logo */
        .logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin: 15px auto;
            display: block;
        }

        /* Form labels */
        label {
            display: block;
            width: 85%;
            margin: 18px auto 8px;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            color: navy;
        }

        /* Username and password fields */
        input {
            width: 85%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        /* Input focus effect */
        input:focus {
            border: 2px solid navy;
        }

        /* Highlight input fields after an invalid login */
        input.invalid {
            border: 2px solid #DC5252;
            background-color: #FDECEC;
        }

        /* Keep invalid highlighting when field is selected */
        input.invalid:focus {
            border: 2px solid #DC5252;
            background-color: #FDECEC;
        }

        /* Inline error notification */
        .error-banner {
            display: none;
            background-color: #FDECEC;
            border: 1px solid #F5B5B5;
            border-left: 4px solid #DC5252;
            border-radius: 6px;
            padding: 12px 15px;
            margin: 15px auto 0;
            width: 85%;
            box-sizing: border-box;
            color: #912018;
            font-family: Arial, sans-serif;
            text-align: left;
        }

        /* Error notification heading */
        .error-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .error-title span {
            margin-right: 6px;
        }

        /* Error notification message */
        .error-banner p {
            font-size: 13px;
            margin: 0;
            line-height: 1.5;
        }

        /* Buttons */
        button {
            background-color: navy;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 25px;
            margin: 20px 7px 0;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Button hover effect */
        button:hover {
            background-color: #4169A1;
            transform: scale(1.03);
        }

        /* IT Department footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px;
            background-color: #E9EDF3;
            color: navy;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }

        /* Adjustments for smaller screens */
        @media screen and (max-width: 550px) {

            .login-card {
                width: 95%;
                margin: 20px auto;
                padding: 20px;
            }

            h1 {
                font-size: 32px;
            }

            .logo {
                width: 170px;
                height: 170px;
            }
        }

    </style>
</head>

<body>

    <!-- Main login card -->
    <div class="login-card">

        <h1>TaskSync Login</h1>

        <h4>Please enter your credentials below</h4>

        <!-- TaskSync logo -->
        <img
            src="TaskSync Blue Gradient Logo.png"
            alt="TaskSync Logo"
            class="logo"
        >

        <!-- Login form -->
        <form id="loginForm" novalidate>

            <!-- Username -->
            <label for="username">Username:</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <!-- Password -->
            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <!-- Login button -->
            <button type="submit">Login</button>

            <!-- Clear button -->
            <button type="reset">Clear</button>

        </form>

        <!-- Inline error notification -->
        <div
            id="loginError"
            class="error-banner"
            role="alert"
            aria-live="assertive"
        >

            <div class="error-title">
                <span>⚠</span> Authentication Error
            </div>

            <p>
                Invalid username or password. Please try again or
                contact the IT Department for additional assistance.
            </p>

        </div>

    </div>

    <!-- IT Department contact information -->
    <footer>
        Any problems? Please contact the IT Department: 555-555-5555
    </footer>

    <script>

        // Get the login form and input fields
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginError = document.getElementById("loginError");


        // Runs when the user clicks Login
        loginForm.addEventListener("submit", function(event) {

            // Prevents the form from refreshing the page
            event.preventDefault();

            // Get the username and password entered by the user
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Hide any previous error notification
            loginError.style.display = "none";

            // Remove red highlighting from previous attempts
            usernameInput.classList.remove("invalid");
            passwordInput.classList.remove("invalid");


            // Administrator login
            if (username === "admin" && password === "admin123") {

                window.location.href = "administrator.html";

            }

            // Manager login
            else if (username === "manager" && password === "manager123") {

                window.location.href = "manager.html";

            }

            // Employee login
            else if (username === "employee" && password === "employee123") {

                window.location.href = "employee.html";

            }

            // Invalid login information
            else {

                // Display the inline red error notification
                loginError.style.display = "block";

                // Highlight the username field in red
                usernameInput.classList.add("invalid");

                // Highlight the password field in red
                passwordInput.classList.add("invalid");

            }

        });


        // Runs when the user clicks Clear
        loginForm.addEventListener("reset", function() {

            // Hide the error notification
            loginError.style.display = "none";

            // Remove red highlighting from the username field
            usernameInput.classList.remove("invalid");

            // Remove red highlighting from the password field
            passwordInput.classList.remove("invalid");

        });

    </script>

</body>
</html>
