
<!DOCTYPE html>
<html>
<head>
    <title>TaskSync Login Page</title>
</head>

<body style="background-color: lightgray; text-align: center; font-size: 20px;">

   <h1 style="font-size: 48px; color: navy;">TaskSync Login</h1>
<h4 style="color: navy;">Please enter your credentials below</h4>

    <!-- Company Logo -->
    <img src="TaskSync Blue Gradient Logo.png"
         alt="TaskSync Logo"
         width="200" height="200">

    <br><br>

    <form>
          <label for="username" style="color: navy;">Username:</label>
        <input type="text" id="username" name="username"
            placeholder="Enter your username"
            style="font-size: 20px; padding: 8px;">

        <br><br>

        <label for="password" style="color: navy;">Password:</label>
        <input type="password" id="password" name="password"
            placeholder="Enter your password"
            style="font-size: 20px; padding: 8px;">

        <br><br>

<button type="submit" style="font-size: 20px; padding: 8px 16px; background-color: navy; color: white; border-radius: 12px; border: none;">
    Login
</button>

<button type="reset" style="font-size: 20px; padding: 8px 16px; background-color: navy; color: white; border-radius: 12px; border: none;">
    Clear
</button>
</form>

    <h6 style="position: fixed; bottom: 0; left: 0; width: 100%; text-align: center; color: navy">
    Any problems please contact the IT Department: 555-555-5555
</h6>

    
    <script>
    document.querySelector("form").addEventListener("submit", function(event) {
        event.preventDefault();

        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if (username === "admin" && password === "admin123") {
            window.location.href = "administrator.html";
        }
        else if (username === "manager" && password === "manager123") {
            window.location.href = "manager.html";
        }
        else if (username === "employee" && password === "employee123") {
            window.location.href = "employee.html";
        }
        else {
            alert("Invalid username or password.");
        }
    });
    </script>

</body>
</html>
