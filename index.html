
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>

<body style="background-color: lightgray; text-align: center; font-size: 20px;">

    <h1 style="font-size: 48px;">Company Log in Page</h1>

    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username"
            placeholder="Enter your username"
               style="font-size: 20px; padding: 8px;">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
            placeholder="Enter your password"
               style="font-size: 20px; padding: 8px;">

        <br><br>

        <button type="submit" style="font-size: 20px; padding: 8px 16px;">
            Login
        </button>

        <button type="reset" style="font-size: 20px; padding: 8px 16px;">
            Clear
        </button>
    </form>

</body>
</html>
